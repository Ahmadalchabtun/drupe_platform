name: Validate and Deploy to K3s
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install kubeval
      run: |
        wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
        tar xf kubeval-linux-amd64.tar.gz
        sudo mv kubeval /usr/local/bin/
    - name: Validate Kubernetes manifests
      run: kubeval --strict --ignore-missing-schemas k8s/*.yml
    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
    - name: Deploy to K3s (placeholder)
      run: |
        echo "Deployment to K3s cluster would happen here if Kubeconfig is provided."
        # Voor nu alleen een placeholder; we voegen later echte deployment toe
